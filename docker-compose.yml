services:
  postgres:
    image: postgres:16
    container_name: opda-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: opda_dashboard
      POSTGRES_USER: opda_user
      POSTGRES_PASSWORD: opda_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [opda-net]

  redis:
    image: redis:7
    container_name: opda-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [opda-net]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: opda-keycloak
    command: ["start-dev"]
    environment:
      KC_HTTP_RELATIVE_PATH: /auth

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/opda_dashboard
      KC_DB_USERNAME: opda_user
      KC_DB_PASSWORD: opda_pass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adminpass
      
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8080:8080"
    networks: [opda-net]

  backend:
    build: ./backend
    container_name: opda-backend
    environment:
      ENABLED_FEATURES: ${ENABLED_FEATURES}
      DATA_SOURCE: ${DATA_SOURCE}
      DATABASE_URL: ${DATABASE_URL}

      KC_INTERNAL_BASE: ${KC_INTERNAL_BASE}
      KC_REALM: ${KC_REALM}
      KC_EXTERNAL_ISSUER: ${KC_EXTERNAL_ISSUER}
      KC_CLIENT_ID: ${KC_CLIENT_ID}
    depends_on:
      - keycloak
    networks: [opda-net]

  nginx:
    image: nginx:1.27
    container_name: opda-nginx
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - keycloak
    networks: [opda-net]

networks:
  opda-net:

volumes:
  pgdata:
  redisdata:
